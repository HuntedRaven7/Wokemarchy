name: wokemarchy
ref-storage: project.refs
format-version: 2

variables:
  # Architecture targets
  target-arch: x86_64
  go-arch: amd64
  arch: x86_64

  # freedesktop-sdk version - track stable branch
  fsdk-track: master

  # Build environment
  RUSTFLAGS: "-C target-cpu=x86-64-v3 -C debuginfo=2"
  CARGO_HOME: "%{build-root}/cargo"
  CARGO_TARGET_DIR: "%{build-root}/target"

  # Python for build scripts
  PYTHON: python3

  # Zig version for ghostty
  zig-version: 0.13.0

# Default split rules (inherited from freedesktop-sdk)
# Additional split rules for wokemarchy-specific packages
public:
  bst:
    split-rules:
      wokemarchy-runtime:
        - |
          %{bindir}/ghostty
          %{bindir}/quickshell
          %{bindir}/mango
          %{bindir}/awww
          %{bindir}/rofi
          %{bindir}/tuigreet
          %{bindir}/greetd
          %{bindir}/bootc
          %{datadir}/awww
          %{datadir}/quickshell
          %{datadir}/mango
          %{datadir}/fcitx5
          %{datadir}/greetd
          %{libdir}/fcitx5
          %{libdir}/greetd
          %{libdir}/mango
      wokemarchy-devel:
        - |
          %{includedir}/quickshell
          %{includedir}/mango
          %{libdir}/pkgconfig/quickshell.pc
          %{libdir}/pkgconfig/mango.pc
          %{libdir}/libquickshell*.a
          %{libdir}/libmango*.a
      wokemarchy-debug:
        - |
          %{libdir}/debug/.build-id/*
          %{libdir}/debug/usr/bin/ghostty
          %{libdir}/debug/usr/bin/quickshell
          %{libdir}/debug/usr/bin/mango
          %{libdir}/debug/usr/bin/awww
          %{libdir}/debug/usr/bin/rofi
          %{libdir}/debug/usr/bin/tuigreet
          %{libdir}/debug/usr/bin/greetd
          %{libdir}/debug/usr/bin/bootc

# Sandbox configuration
sandbox:
  build-root: /var/tmp/buildstream
  # Use bubblewrap for isolation
  type: bubblewrap

# Plugins
plugins:
  # freedesktop-sdk plugins
  - origin: pip
    package-name: buildstream-external
    elements:
      cargo: 1
      cargo2: 1
      flatpak_image: 1
      flatpak_repo: 1
      oci: 1
      ostree: 1

# Mirror configuration for faster downloads
mirrors:
  # Cargo crates.io mirror
  cargo:
    - url: https://crates.io
      fingerprint: "<fingerprint>"
    - url: https://github.com/rust-lang/crates.io-index
      fingerprint: "<fingerprint>"

  # PyPI mirror for Python packages
  pypi:
    - url: https://pypi.org/simple
      fingerprint: "<fingerprint>"

  # Git mirrors
  git:
    - url: https://gitlab.com
      fingerprint: "<fingerprint>"
    - url: https://github.com
      fingerprint: "<fingerprint>"
    - url: https://codeberg.org
      fingerprint: "<fingerprint>"

# Build configuration
defaults:
  # Default integration commands
  integrate-commands:
    - /usr/bin/glib-compile-schemas %{datadir}/glib-2.0/schemas
    - /usr/bin/update-desktop-database %{datadir}/applications
    - /usr/bin/fc-cache -f

# Project-specific element defaults
elements:
  autotools:
    configure-commands:
      - ./configure --prefix=%{prefix} --disable-static --enable-shared
    install-commands:
      - make install DESTDIR=%{install-root}
  meson:
    configure-commands:
      - meson setup --prefix=%{prefix} --buildtype=release -Ddefault_library=shared %{build-dir}
    install-commands:
      - meson install -C %{build-dir} --destdir %{install-root}
  cmake:
    configure-commands:
      - cmake -DCMAKE_INSTALL_PREFIX=%{prefix} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -B %{build-dir} .
    install-commands:
      - cmake --install %{build-dir} --prefix %{prefix} --destdir %{install-root}
  cargo:
    build-commands:
      - cargo build --release --target-dir %{build-root}/target
    install-commands:
      - cp -a %{build-root}/target/release/%{package-name} %{install-root}%{bindir}/
      - |
        # Install completions if they exist
        for shell in bash fish zsh; do
          if [ -f %{build-root}/target/release/completions/%{package-name}.$shell ]; then
            mkdir -p %{install-root}%{datadir}/%{package-name}/completions
            cp %{build-root}/target/release/completions/%{package-name}.$shell %{install-root}%{datadir}/%{package-name}/completions/
          fi
        done
  cargo2:
    build-commands:
      - cargo build --release --target-dir %{build-root}/target
    install-commands:
      - cargo install --root %{install-root} --path . --locked

# Cache configuration
cache:
  quota: 50G